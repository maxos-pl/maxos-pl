<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: url(#titleGrad);
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: 'Fira Code', 'Cascadia Code', monospace, Consolas;
      font-size: 12px;
      fill: #38bdf8;
      font-weight: 600;
    }
  </style>

  <!-- Card Background with Border -->
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="50" r="140" fill="url(#glowGrad1)" />
  <circle cx="750" cy="170" r="130" fill="url(#glowGrad2)" />

  <!-- Smooth Background Wave -->
  <path d="M 2 170 Q 225 120 450 160 T 898 140 L 898 216 L 2 216 Z" fill="url(#waveGrad)" />

  <!-- Decorative Grid / Dots -->
  <g fill="#38bdf8" opacity="0.15">
    <circle cx="50" cy="40" r="1.5" /><circle cx="70" cy="40" r="1.5" /><circle cx="90" cy="40" r="1.5" />
    <circle cx="50" cy="60" r="1.5" /><circle cx="70" cy="60" r="1.5" /><circle cx="90" cy="60" r="1.5" />
    <circle cx="50" cy="80" r="1.5" /><circle cx="70" cy="80" r="1.5" /><circle cx="90" cy="80" r="1.5" />
    <circle cx="810" cy="140" r="1.5" /><circle cx="830" cy="140" r="1.5" /><circle cx="850" cy="140" r="1.5" />
    <circle cx="810" cy="160" r="1.5" /><circle cx="830" cy="160" r="1.5" /><circle cx="850" cy="160" r="1.5" />
    <circle cx="810" cy="180" r="1.5" /><circle cx="830" cy="180" r="1.5" /><circle cx="850" cy="180" r="1.5" />
  </g>

  <!-- Code Decorator Icons -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3">
    <!-- Left bracket < -->
    <path d="M 120 90 L 105 105 L 120 120" />
    <!-- Right bracket > -->
    <path d="M 780 90 L 795 105 L 780 120" />
  </g>

  <!-- Center Content -->
  <!-- Main Title -->
  <text x="450" y="88" text-anchor="middle" class="title">Kirill | Maxos</text>

  <!-- Subtitle -->
  <text x="450" y="125" text-anchor="middle" class="subtitle">Software Engineer • Backend &amp; Desktop</text>

  <!-- Tech Mini-Pills in Header -->
  <g transform="translate(240, 150)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="85" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="42.5" y="17" text-anchor="middle" class="badge-text">C# / .NET</text>

    <!-- Pill 2 -->
    <rect x="100" y="0" width="80" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="140" y="17" text-anchor="middle" class="badge-text" fill="#818cf8">Python</text>

    <!-- Pill 3 -->
    <rect x="195" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <text x="247.5" y="17" text-anchor="middle" class="badge-text" fill="#c084fc">Java / Kotlin</text>

    <!-- Pill 4 -->
    <rect x="315" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="367.5" y="17" text-anchor="middle" class="badge-text">Architecture</text>
  </g>
</svg>
